# llama-swap config: one OpenAI/Anthropic address that switches between FreeToken models
# and other engines (here NInfer) on one GPU. Copy next to the llama-swap binary, fix paths.
# Run: llama-swap --config config.yaml --listen 0.0.0.0:2040
#
# Only one model runs at a time (the default swap group). Swapping back to FreeToken reloads
# its expert banks (~68 GB of host RAM, 2-3 min on the RTX 5090 box), so nothing unloads on
# a timer: ttl 0 everywhere, and a swap happens only when a request names another model.

healthCheckTimeout: 600
logLevel: info
# Off: it writes "loading..." text into the model's thinking output.
sendLoadingState: false
globalTTL: 0

macros:
  ft: "${env.HOME}/FreeToken/scripts/llama-swap/freetoken.sh"
  other: "${env.HOME}/FreeToken/scripts/llama-swap/other-engine.sh"
  ninfer: "${other} ${env.HOME}/ninfer-work/ninfer/build/apps/ninfer-serve"
  ninfer_args: >-
    --host 127.0.0.1 --port 8090
    --max-context 150000 --kv-capacity 200000
    --max-concurrency 4 --max-pending-requests 16 --pending-timeout-ms 300000
    --kv-dtype fp8 --host-state-slots 8 --host-kv-mib 8192
    --spec mtp --draft-tokens 4 --lm-head-draft
    --preserve-thinking --vision

models:
  "qwen3.8-flash":
    name: "Qwen3.8 Flash Next NVFP4 (FreeToken)"
    cmd: ${ft} ${env.HOME}/models/Qwen3.8-Flash-Next-NVFP4
    proxy: http://127.0.0.1:2020
    # /health answers 200 while loading; /ready is 503 until chats are answered.
    checkEndpoint: /ready
    # A page Stop takes up to ~2 min to free the card.
    unloadTimeout: 180
    aliases:
      - "Qwen3.8-Flash-Next-NVFP4"

  "fable-27b":
    name: "Fable 27B NVFP4 (NInfer)"
    cmd: ${ninfer} ${env.HOME}/ninfer-work/models/fable_27b_nvfp4.ninfer --model-id fable-27b ${ninfer_args}
    proxy: http://127.0.0.1:8090
    useModelName: "fable-27b"
    unloadTimeout: 60
    env:
      - "PATH=/usr/local/cuda/bin:/usr/bin:/bin"
