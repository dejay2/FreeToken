<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FreeToken settings</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f7fb;
      --panel: #fff;
      --ink: #172033;
      --muted: #63708a;
      --line: #d9e0ec;
      --accent: #2857c7;
      --accent-soft: #e7edff;
      --good: #16734a;
      --warn: #a05b08;
      --bad: #b32f3d;
      --shadow: 0 10px 30px #1f315010;
    }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; --paper: #111622; --panel: #1b2231; --ink: #edf2ff; --muted: #aeb8ce; --line: #354057; --accent: #9eb8ff; --accent-soft: #27385f; --good: #71d6a3; --warn: #f0b15e; --bad: #ff8994; --shadow: 0 10px 30px #0008; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    .shell { max-width: 1440px; margin: 0 auto; padding: 28px clamp(16px, 3vw, 42px) 48px; }
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: clamp(1.6rem, 3vw, 2.35rem); letter-spacing: -.03em; }
    h2 { font-size: 1.05rem; margin-bottom: 14px; }
    h3 { font-size: .98rem; }
    .eyebrow { color: var(--accent); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: .73rem; margin-bottom: 6px; }
    .subtitle, .small, .help, .meta { color: var(--muted); }
    .subtitle { margin-top: 5px; max-width: 680px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
    .button { border: 1px solid var(--line); background: var(--panel); border-radius: 9px; color: var(--ink); padding: 9px 14px; font-weight: 650; }
    .button:hover:not(:disabled) { border-color: var(--accent); }
    .button.primary { border-color: var(--accent); background: var(--accent); color: white; }
    .button.danger { color: var(--bad); }
    .layout { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, .8fr); gap: 18px; align-items: start; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 18px; }
    .settings-panel { grid-row: span 3; }
    .group + .group { margin-top: 24px; }
    .group-title { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
    .group-title::before { content: ""; width: 5px; height: 20px; border-radius: 3px; background: var(--accent); }
    .dial { display: grid; grid-template-columns: minmax(150px, .65fr) minmax(180px, 1fr); gap: 5px 18px; padding: 12px 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 65%, transparent); }
    .dial:last-child { border-bottom: 0; }
    .dial-label { font-weight: 700; overflow-wrap: anywhere; }
    .dial-control { min-width: 0; }
    .help { grid-column: 1 / -1; font-size: .84rem; }
    .unit { color: var(--muted); font-size: .8rem; margin-left: 5px; font-weight: 500; }
    input[type="text"], input[type="number"], select { width: 100%; min-height: 37px; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; color: var(--ink); background: var(--paper); }
    input:focus, select:focus, button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 32%, transparent); outline-offset: 1px; }
    .toggle { display: inline-flex; align-items: center; gap: 9px; min-height: 37px; }
    .toggle input { width: 42px; height: 23px; accent-color: var(--accent); }
    .error { color: var(--bad); font-size: .83rem; margin-top: 3px; }
    .notice { min-height: 22px; margin: 12px 0 0; color: var(--muted); }
    .notice.good { color: var(--good); }
    .notice.bad { color: var(--bad); }
    .notice .button { margin-left: 8px; padding: 5px 9px; }
    .status-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .stat { border: 1px solid var(--line); border-radius: 10px; padding: 10px; min-width: 0; }
    .stat .small { font-size: .75rem; }
    .stat strong { display: block; font-size: 1.05rem; overflow-wrap: anywhere; }
    .state { display: inline-flex; align-items: center; gap: 6px; }
    .state::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .state.serving::before { background: var(--good); }
    .state.failed::before { background: var(--bad); }
    .state.booting::before, .state.stopping::before { background: var(--warn); }
    .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 6px; }
    .bar > span { display: block; height: 100%; background: var(--accent); }
    .log-actions, .profile-head, .job { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .log { max-height: 245px; overflow: auto; background: #101521; color: #d7e2f7; border-radius: 9px; padding: 12px; margin-top: 10px; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .check { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: .85rem; }
    .profile { border-top: 1px solid var(--line); padding: 12px 0; }
    .profile:first-of-type { border-top: 0; }
    .profile p { margin-top: 3px; }
    .profile .button { padding: 5px 9px; font-size: .82rem; }
    .inline-form { display: flex; gap: 8px; margin-top: 12px; }
    .inline-form input { flex: 1; }
    .confirm { color: var(--warn); font-size: .82rem; margin-top: 7px; }
    .confirm button { border: 0; background: none; color: var(--accent); padding: 0 4px; text-decoration: underline; }
    .empty { color: var(--muted); padding: 8px 0; }
    @media (max-width: 880px) { header { flex-direction: column; } .actions { justify-content: flex-start; } .layout { grid-template-columns: 1fr; } .settings-panel { grid-row: auto; } }
    @media (max-width: 560px) { .dial { grid-template-columns: 1fr; gap: 4px; } .help { grid-column: auto; } .status-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">FreeToken</p>
        <h1>Server settings</h1>
        <p class="subtitle">Change how the server starts. The helper stays here even if the main server is stopped or cannot start.</p>
      </div>
      <div class="actions" aria-label="Server actions">
        <button class="button primary" id="save" type="button">Save</button>
        <button class="button" type="button" onclick="serverAction('restart')">Restart</button>
        <button class="button" type="button" onclick="serverAction('start')">Start</button>
        <button class="button danger" type="button" onclick="serverAction('stop')">Stop</button>
      </div>
    </header>

    <div class="layout">
      <section class="panel settings-panel" aria-labelledby="settings-title">
        <h2 id="settings-title">Startup choices</h2>
        <div id="settings" aria-live="polite"><p class="empty">Loading choices…</p></div>
        <p id="notice" class="notice" aria-live="polite"></p>
      </section>

      <section class="panel" aria-labelledby="status-title">
        <h2 id="status-title">Live status</h2>
        <div id="status" class="status-grid"><p class="empty">Checking…</p></div>
        <div id="job" class="notice" aria-live="polite"></div>
      </section>

      <section class="panel" aria-labelledby="logs-title">
        <div class="log-actions"><h2 id="logs-title">Boot log</h2><button class="button" id="refresh-logs" type="button">Refresh</button></div>
        <label class="check"><input id="auto-follow" type="checkbox" checked> Keep following new lines</label>
        <pre id="logs" class="log">Loading log…</pre>
      </section>

      <section class="panel" aria-labelledby="profiles-title">
        <div class="profile-head"><h2 id="profiles-title">Saved profiles</h2><button class="button" id="new-profile" type="button">Save current</button></div>
        <div id="profile-form" hidden>
          <label class="small" for="profile-name">Profile name</label>
          <div class="inline-form"><input id="profile-name" type="text" maxlength="100" placeholder="For example: Quiet laptop mode"><button class="button primary" id="profile-save" type="button">Save</button><button class="button" id="profile-cancel" type="button">Cancel</button></div>
        </div>
        <div id="profiles"><p class="empty">Loading profiles…</p></div>
      </section>
    </div>
  </main>

  <script>
    'use strict';
    const state = { settings: {}, dials: [], profiles: [], busy: false, jobId: null, jobTimer: null, statusTimer: null, logTimer: null };
    const groupNames = {
      'Model and context': 'Model and message size',
      'Chats': 'Chats',
      'KV notes and parking': 'Keeping chat memory',
      'Expert slots and card memory': 'GPU memory and expert space',
      'Picture input': 'Pictures',
      'Look-ahead speed trick (MTP)': 'Extra speed',
      'Loading and diagnostics': 'Loading and health checks',
      'Advanced': 'Other settings'
    };
    const $ = (id) => document.getElementById(id);
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    const json = async (url, options) => { const response = await fetch(url, options); let body = {}; try { body = (await response.json()) || {}; } catch (_) {} return { response, body }; };
    const setNotice = (message, kind = '') => { $('notice').textContent = message; $('notice').className = `notice ${kind}`; };
    const labelFor = (name) => name.replace(/^FREETOKEN_/, '').replace(/([a-z])([A-Z])/g, '$1 $2').replace(/_/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
    const groupLabel = (group) => groupNames[group] || labelFor(group);
    const valueFor = (dial) => state.settings[dial.name] ?? dial.value ?? '';

    function inputHtml(dial) {
      const value = valueFor(dial);
      if (dial.control === "toggle") {
        const checked = value === true || value === 1 || value === '1' || value === 'true';
        return `<label class="toggle"><input data-dial="${escapeHtml(dial.name)}" type="checkbox" ${checked ? 'checked' : ''}><span>${checked ? 'On' : 'Off'}</span></label>`;
      }
      if (dial.control === "choice") {
        const options = (dial.options || []).map((option) => `<option value="${escapeHtml(option)}" ${String(option) === String(value) ? 'selected' : ''}>${escapeHtml(option || 'Automatic')}</option>`).join('');
        return `<select data-dial="${escapeHtml(dial.name)}">${options}</select>`;
      }
      if (dial.control === "number") {
        const fractional = [dial.min, dial.max, value].some((item) => item != null && Number(item) % 1 !== 0);
        const bounds = `${dial.min != null ? ` min="${escapeHtml(dial.min)}"` : ''}${dial.max != null ? ` max="${escapeHtml(dial.max)}"` : ''} step="${fractional ? 'any' : '1'}"`;
        return `<input data-dial="${escapeHtml(dial.name)}" type="number" value="${escapeHtml(value)}"${bounds}>`;
      }
      if (dial.control === "path" || dial.control === "text") {
        return `<input data-dial="${escapeHtml(dial.name)}" type="text" value="${escapeHtml(value)}">`;
      }
      return `<input data-dial="${escapeHtml(dial.name)}" type="text" value="${escapeHtml(value)}">`;
    }

    function renderDial(dial) {
      return `<div class="dial" data-dial-row="${escapeHtml(dial.name)}"><div class="dial-label">${escapeHtml(labelFor(dial.name))}${dial.unit ? `<span class="unit">${escapeHtml(dial.unit)}</span>` : ''}</div><div class="dial-control">${inputHtml(dial)}<div class="error" data-error="${escapeHtml(dial.name)}"></div></div><div class="help">${escapeHtml(dial.help || '')}</div></div>`;
    }

    function updateDialValue(control) {
      state.settings[control.dataset.dial] = control.type === 'checkbox' ? (control.checked ? true : false) : (control.type === 'number' ? (control.value === '' ? '' : Number(control.value)) : control.value);
      if (control.type === 'checkbox') control.nextElementSibling.textContent = control.checked ? 'On' : 'Off';
    }

    function renderSettings() {
      const groups = [];
      state.dials.forEach((dial) => { let group = groups.find((item) => item.name === dial.group); if (!group) { group = { name: dial.group, dials: [] }; groups.push(group); } group.dials.push(dial); });
      $('settings').innerHTML = groups.length ? groups.map((group) => `<section class="group"><h3 class="group-title">${escapeHtml(groupLabel(group.name))}</h3>${group.dials.map((dial) => renderDial(dial)).join('')}</section>`).join('') : '<p class="empty">No startup choices were returned.</p>';
      $('settings').querySelectorAll('[data-dial]').forEach((control) => { const update = () => updateDialValue(control); control.addEventListener('input', update); control.addEventListener('change', update); });
    }

    function showFieldErrors(errors) {
      const fields = Array.from(document.querySelectorAll('[data-error]'));
      fields.forEach((node) => { node.textContent = ''; });
      (Array.isArray(errors) ? errors : []).forEach((error) => { const node = fields.find((candidate) => candidate.dataset.error === error.field); if (node) node.textContent = error.message || 'This choice is not valid.'; });
    }

    async function loadSettings() {
      const { response, body } = await json('/api/settings');
      if (!response.ok) throw new Error(body.detail || 'Could not load settings.');
      state.settings = { ...(body.settings || {}) };
      state.dials = Array.isArray(body.dials) ? body.dials : [];
      state.dials.forEach((dial) => { if (!(dial.name in state.settings) && dial.value !== undefined) state.settings[dial.name] = dial.value; });
      renderSettings();
    }

    async function saveSettings() {
      setBusy(true);
      showFieldErrors([]);
      try {
        const { response, body } = await json('/api/settings', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ settings: state.settings }) });
        if (response.status === 422) { showFieldErrors(body.detail); setNotice('Some choices need attention.', 'bad'); }
        else if (!response.ok) setNotice(body.detail || 'Could not save choices.', 'bad');
        else { state.settings = { ...(body.settings || state.settings) }; renderSettings(); setNotice('Saved. Restart the server for startup changes to take effect.', 'good'); }
      } catch (error) {
        setNotice(error.message || 'Could not save choices.', 'bad');
      } finally {
        setBusy(false);
      }
    }

    function setBusy(value) { state.busy = value; document.querySelectorAll('button').forEach((button) => { button.disabled = value; }); }
    function offerRestart() { const notice = $('notice'); notice.className = 'notice good'; notice.textContent = 'Profile applied. Restart the server to use it.'; const restart = document.createElement('button'); restart.className = 'button'; restart.type = 'button'; restart.dataset.jobButton = 'true'; restart.textContent = 'Restart now'; restart.addEventListener('click', () => serverAction('restart')); notice.append(restart); }
    async function serverAction(action) {
      if (state.busy) return;
      setBusy(true);
      setNotice(`${labelFor(action)}ing server…`);
      try {
        const { response, body } = await json(`/api/server/${action}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ force: false }) });
        if (!response.ok) throw new Error(body.detail || 'The server action could not start.');
        if (!body.jobId) throw new Error('The server did not return a progress job.');
        state.jobId = body.jobId;
        pollJob();
      } catch (error) {
        state.jobId = null;
        setNotice(error.message || 'The server action could not start.', 'bad');
        setBusy(false);
      }
    }

    async function pollJob() {
      if (!state.jobId) return;
      try {
        const { response, body } = await json(`/api/server/jobs/${encodeURIComponent(state.jobId)}`);
        if (!response.ok) throw new Error('Could not read server progress.');
        const stage = body.stage || 'working';
        $('job').innerHTML = `<span class="state ${escapeHtml(stage)}">${escapeHtml(stage.replace(/_/g, ' '))}</span> ${escapeHtml(body.progress || '')}${body.error ? `<div class="error">${escapeHtml(body.error)}</div>` : ''}`;
        if (stage === 'failed') throw new Error(body.error || 'The server could not start.');
        if (['serving', 'stopped'].includes(stage)) {
          setNotice(stage === 'serving' ? 'The server is ready.' : 'The server is stopped.', 'good');
          state.jobId = null;
          clearTimeout(state.jobTimer);
          setBusy(false);
          loadStatus();
          return;
        }
        state.jobTimer = setTimeout(pollJob, 1500);
      } catch (error) {
        state.jobId = null;
        setNotice(error.message || 'Could not read server progress.', 'bad');
        setBusy(false);
      }
    }

    function formatBytes(mb) { return mb == null ? '—' : `${Number(mb).toLocaleString()} MB`; }
    async function loadStatus() { const { response, body } = await json('/api/status'); if (!response.ok) return; const server = body.server || {}; const gpu = body.gpu || {}; const stateName = server.state || (server.reachable ? 'unknown' : 'stopped'); const used = Number(gpu.vramUsedMb || 0); const total = Number(gpu.vramTotalMb || 0); const percent = total ? Math.min(100, used / total * 100) : 0; $('status').innerHTML = `<div class="stat"><span class="small">Helper</span><strong class="state serving">${escapeHtml(body.helper?.status || 'unknown')}</strong></div><div class="stat"><span class="small">Main server</span><strong class="state ${escapeHtml(stateName)}">${escapeHtml(stateName.replace(/_/g, ' '))}</strong></div><div class="stat"><span class="small">Running chats</span><strong>${escapeHtml(server.activeRequests ?? 0)}</strong></div><div class="stat"><span class="small">Card memory</span><strong>${escapeHtml(formatBytes(gpu.vramUsedMb))} / ${escapeHtml(formatBytes(gpu.vramTotalMb))}</strong><div class="bar" aria-label="Card memory used"><span style="width:${percent}%"></span></div></div>`; }

    async function loadLogs() { const { response, body } = await json('/api/logs?limit=100'); if (response.ok) $('logs').textContent = (body.lines || []).join('\n') || 'No log lines yet.'; }
    function startLogRefresh() { clearTimeout(state.logTimer); if ($('auto-follow').checked) state.logTimer = setTimeout(async () => { await loadLogs(); startLogRefresh(); }, 3000); }

    function renderProfiles() { $('profiles').innerHTML = state.profiles.length ? state.profiles.map((profile) => `<article class="profile"><div class="profile-head"><div><h3>${escapeHtml(profile.name)}</h3><p class="small">${escapeHtml(profile.description || '')}</p></div><div class="actions"><button class="button" type="button" data-apply="${escapeHtml(profile.id)}">Apply</button>${profile.isPreset ? '' : `<button class="button danger" type="button" data-delete="${escapeHtml(profile.id)}">Delete</button>`}</div></div><div class="small">${escapeHtml(Object.entries(profile.settings || {}).map(([key, value]) => `${labelFor(key)}: ${value}`).join(' · '))}</div><div class="confirm" data-confirm="${escapeHtml(profile.id)}" hidden>Delete this profile? <button type="button" data-confirm-delete="${escapeHtml(profile.id)}">Yes, delete</button> <button type="button" data-cancel-delete="${escapeHtml(profile.id)}">Keep it</button></div></article>`).join('') : '<p class="empty">No saved profiles yet.</p>'; document.querySelectorAll('[data-apply]').forEach((button) => button.addEventListener('click', () => applyProfile(button.dataset.apply))); document.querySelectorAll('[data-delete]').forEach((button) => button.addEventListener('click', () => { const confirm = document.querySelector(`[data-confirm="${CSS.escape(button.dataset.delete)}"]`); if (confirm) confirm.hidden = false; })); document.querySelectorAll('[data-confirm-delete]').forEach((button) => button.addEventListener('click', () => deleteProfile(button.dataset.confirmDelete))); document.querySelectorAll('[data-cancel-delete]').forEach((button) => button.addEventListener('click', () => { const confirm = document.querySelector(`[data-confirm="${CSS.escape(button.dataset.cancelDelete)}"]`); if (confirm) confirm.hidden = true; })); }
    async function loadProfiles() { const { response, body } = await json('/api/profiles'); if (response.ok) { state.profiles = body.profiles || []; renderProfiles(); } }
    async function applyProfile(id) { const { response, body } = await json(`/api/profiles/${encodeURIComponent(id)}/apply`, { method: 'POST' }); if (!response.ok) { setNotice(body.detail || 'Could not apply profile.', 'bad'); return; } state.settings = { ...(body.settings || state.settings) }; renderSettings(); offerRestart(); }
    async function deleteProfile(id) { const { response, body } = await json(`/api/profiles/${encodeURIComponent(id)}`, { method: 'DELETE' }); if (!response.ok) { setNotice(body.detail || 'Could not delete profile.', 'bad'); return; } setNotice('Profile deleted.', 'good'); loadProfiles(); }
    async function saveProfile() { const name = $('profile-name').value.trim(); if (!name) { $('profile-name').focus(); return; } const { response, body } = await json('/api/profiles', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, description: 'Saved from the settings page', settings: state.settings }) }); if (!response.ok) { setNotice(body.detail || 'Could not save profile.', 'bad'); return; } $('profile-form').hidden = true; $('profile-name').value = ''; state.profiles.push(body); renderProfiles(); setNotice('Profile saved.', 'good'); }

    $('save').addEventListener('click', saveSettings); $('refresh-logs').addEventListener('click', async () => { await loadLogs(); startLogRefresh(); }); $('auto-follow').addEventListener('change', startLogRefresh); $('new-profile').addEventListener('click', () => { $('profile-form').hidden = false; $('profile-name').focus(); }); $('profile-cancel').addEventListener('click', () => { $('profile-form').hidden = true; $('profile-name').value = ''; }); $('profile-save').addEventListener('click', saveProfile); $('profile-name').addEventListener('keydown', (event) => { if (event.key === 'Enter') saveProfile(); });
    async function boot() { try { await Promise.all([loadSettings(), loadProfiles(), loadStatus(), loadLogs()]); startLogRefresh(); state.statusTimer = setInterval(loadStatus, 3000); } catch (error) { setNotice(error.message || 'Could not load the settings page.', 'bad'); } }
    boot();
  </script>
</body>
</html>
