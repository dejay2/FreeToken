# generated by the control panel from registry.json; edits here are overwritten

healthCheckTimeout: 600
logLevel: info
sendLoadingState: false
globalTTL: 0

memoryGate:
  probe: windows
  floorGB: 6
  waitSeconds: 300
  helperURL: "http://127.0.0.1:2031"

routing:
  scheduler:
    settings:
      fifo:
        latestWins: true

macros:
  ft: "${env.HOME}/FreeToken/engines/adapters/freetoken.sh"
  ninfer: "${env.HOME}/FreeToken/engines/adapters/ninfer.sh ${env.HOME}/FreeToken/engines/ninfer/build/apps/ninfer-serve"
  ninfer_upstream: "${env.HOME}/FreeToken/engines/adapters/ninfer.sh ${env.HOME}/FreeToken/engines/ninfer-upstream/build/apps/ninfer-serve"

models:
  # --- model qwen3.8-flash ---
  "qwen3.8-flash":
    name: "Qwen3.8 Flash Next NVFP4 (FreeToken)"
    cmd: "${ft} --profile model-qwen3.8-flash ${env.HOME}/models/Qwen3.8-Flash-Next-NVFP4"
    proxy: "http://127.0.0.1:2020"
    checkEndpoint: "/ready?model=Qwen3.8-Flash-Next-NVFP4"
    unloadTimeout: 180
    ramNeedGB: 58
    ttl: 0
    aliases: ["Qwen3.8-Flash-Next-NVFP4"]
  # --- model qwen3.8-flash-abliterated ---
  "qwen3.8-flash-abliterated":
    name: "Qwen3.8 Flash Next ABLITERATED NVFP4 (FreeToken, uncensored)"
    cmd: "${ft} --profile model-qwen3.8-flash-abliterated ${env.HOME}/models/Qwen3.8-Flash-Next-ABLITERATED-NVFP4"
    proxy: "http://127.0.0.1:2020"
    checkEndpoint: "/ready?model=Qwen3.8-Flash-Next-ABLITERATED-NVFP4"
    unloadTimeout: 180
    ramNeedGB: 58
    ttl: 0
    aliases: ["Qwen3.8-Flash-Next-ABLITERATED-NVFP4"]
  # --- model quasar-27b ---
  "quasar-27b":
    name: "Qwen3.8 27B QUASAR NVFP4 (NInfer, DFlash2)"
    cmd: "${ninfer} ${env.HOME}/ninfer-work/models/quasar_27b_nvfp4.ninfer quasar-27b --host 127.0.0.1 --port 8090 --max-context 150000 --kv-capacity 200000 --max-concurrency 4 --pending-timeout-ms 300000 --kv-dtype int8 --spec dflash2 --draft-tokens 7 --lm-head-draft --preserve-thinking --vision"
    proxy: "http://127.0.0.1:8090"
    checkEndpoint: "/health"
    useModelName: "quasar-27b"
    unloadTimeout: 60
    ramNeedGB: 18
    ttl: 0
    aliases: []
    env: ["PATH=/usr/local/cuda/bin:/usr/local/bin:/usr/bin:/bin"]
    filters:
      clampParams: {"temperature": [0, 2], "top_p": [0, 1], "top_k": [0, 20], "min_p": [0, 1], "presence_penalty": [-2, 2], "frequency_penalty": [-2, 2]}
  # --- model fable-27b ---
  "fable-27b":
    name: "Fable 27B NVFP4 (NInfer)"
    cmd: "${ninfer_upstream} ${env.HOME}/ninfer-work/models/fable_27b_nvfp4.ninfer fable-27b --host 127.0.0.1 --port 8090 --max-context 150000 --kv-capacity 200000 --max-concurrency 4 --pending-timeout-ms 300000 --kv-dtype fp8 --spec mtp --draft-tokens 4 --lm-head-draft --preserve-thinking --vision"
    proxy: "http://127.0.0.1:8090"
    checkEndpoint: "/health"
    useModelName: "fable-27b"
    unloadTimeout: 60
    ramNeedGB: 18
    ttl: 0
    aliases: []
    env: ["PATH=/usr/local/cuda/bin:/usr/local/bin:/usr/bin:/bin"]
    filters:
      clampParams: {"temperature": [0, 2], "top_p": [0, 1], "top_k": [0, 20], "min_p": [0, 1], "presence_penalty": [-2, 2], "frequency_penalty": [-2, 2]}
  # --- model twin-27b ---
  "twin-27b":
    name: "Twin 27B NVFP4 (NInfer)"
    cmd: "${ninfer_upstream} ${env.HOME}/ninfer-work/models/twin_nvfp4.ninfer twin-27b --host 127.0.0.1 --port 8090 --max-context 150000 --kv-capacity 200000 --max-concurrency 4 --pending-timeout-ms 300000 --kv-dtype fp8 --spec mtp --draft-tokens 4 --lm-head-draft --preserve-thinking --vision"
    proxy: "http://127.0.0.1:8090"
    checkEndpoint: "/health"
    useModelName: "twin-27b"
    unloadTimeout: 60
    ramNeedGB: 18
    ttl: 0
    aliases: []
    env: ["PATH=/usr/local/cuda/bin:/usr/local/bin:/usr/bin:/bin"]
    filters:
      clampParams: {"temperature": [0, 2], "top_p": [0, 1], "top_k": [0, 20], "min_p": [0, 1], "presence_penalty": [-2, 2], "frequency_penalty": [-2, 2]}
